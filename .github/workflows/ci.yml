name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      - name: Install
        # web extras pull in FastAPI, which tests/test_app.py imports.
        run: pip install -e ".[dev,web]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
